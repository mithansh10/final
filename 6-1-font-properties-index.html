<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Properties</title>
    <style>
      /* 6. Change the the root (html element) font size to 30px --> */
      html {
        font-size: 30px;
        text-align: center;
      }

      body {
        background-color: cornflowerblue;
        color: white;
        font-size: 18px;
      }

      /* 1. Change the color of <p>Color</p> to "coral" color. */
      #color {
        color: coral;
      }

      /* 2. Change the font size of <p>Font Size</p> to to 2X the size of the root (html) element. */
      #size {
        font-size: 2rem;
      }

      /* 3. Change the font weight of <p>Font Weight</p> to 900. */
      #weight {
        font-weight: 900;
      }

      /* 4. Change the font family of <p>Font Family</p> to the Google font Caveat with regular (400) font weight.
      Link: https://fonts.google.com/specimen/Caveat */
      #family {
        font-family: "Caveat", cursive;
      }

      /* 5. Change the <p>Text Align</p> to right align. */
      #align {
        text-align: right;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Caveat&display=swap"
      rel="stylesheet"
    />
  
    <style data-portfolio-theme>
:root {
  color-scheme: light;
  --ink: #1d1924;
  --muted: #504b5a;
  --paper: #f7f4fb;
  --surface: #fff;
  --line: #a29eaa;
  --green: #3f2e56;
  --lime: #998eaa;
  --coral: #763756;
}

:where(*, *::before, *::after) {
  box-sizing: border-box;
}

:where(html) {
  scroll-behavior: smooth;
}

:where(body) {
  margin: 0;
  color: var(--ink);
  background-color: var(--paper);
  background-image: radial-gradient(#a69eac 0.7px, transparent 0.7px);
  background-size: 18px 18px;
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  line-height: 1.6;
}

:where(h1, h2, h3, h4, h5, h6) {
  color: var(--green);
  font-family: Georgia, "Times New Roman", serif;
}

:where(a) {
  color: var(--green);
  text-underline-offset: 4px;
}

:where(a:hover) {
  color: var(--coral);
}

:where(button, input, select, textarea) {
  font: inherit;
}

:where(button, input[type="button"], input[type="submit"], input[type="reset"]) {
  color: var(--surface);
  border: 1px solid var(--green);
  border-radius: 4px;
  background-color: var(--green);
  cursor: pointer;
}

:where(button:hover, input[type="button"]:hover, input[type="submit"]:hover, input[type="reset"]:hover) {
  border-color: var(--coral);
  background-color: var(--coral);
}

:where(:focus-visible) {
  outline: 3px solid var(--coral);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  :where(html) {
    scroll-behavior: auto;
  }
}

    </style>
  </head>

  <body>
    <h1>Important CSS Properties</h1>

    <p id="color">Color</p>

    <p id="size">Font Size</p>

    <p id="weight">Font Weight</p>

    <p id="family">Font Family</p>

    <p id="align">Text Align</p>
  </body>
</html>
