<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="You're invited to celebrate a birthday on October 24."
    />
    <title>Birthday Invitation | Mithansh</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #292333;
        --muted: #716a7f;
        --paper: #f7f4fb;
        --surface: #fff;
        --line: #e4dced;
        --purple: #594278;
        --lavender: #d9c8f0;
        --orchid: #a64d79;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 28px 18px;
        color: var(--ink);
        background:
          radial-gradient(#e8e0f0 0.7px, transparent 0.7px), var(--paper);
        background-size: 18px 18px;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      .invitation {
        width: min(100%, 520px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgb(41 35 51 / 12%);
        text-align: center;
      }

      .invitation-art {
        display: grid;
        min-height: 245px;
        place-items: center;
        padding: 24px;
        background: linear-gradient(145deg, #eee6f6, #f9eff5);
      }

      .invitation-art img {
        display: block;
        width: min(100%, 370px);
        height: 205px;
        object-fit: contain;
      }

      .invitation-content {
        padding: 30px clamp(22px, 6vw, 42px) 38px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--orchid);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      h1,
      h2 {
        font-family: Georgia, "Times New Roman", serif;
      }

      h1 {
        margin: 0;
        color: var(--purple);
        font-size: clamp(34px, 8vw, 46px);
        line-height: 1.12;
      }

      .date {
        display: inline-block;
        margin: 16px 0 0;
        padding: 7px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--purple);
        background: #f8f4fc;
        font-size: 14px;
        font-weight: 700;
      }

      .message {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      .bring-list {
        margin: 24px 0;
        padding: 18px 0 0;
        border-top: 1px solid var(--line);
        list-style: none;
      }

      .bring-list h2 {
        margin: 0 0 12px;
        color: var(--purple);
        font-size: 21px;
      }

      .bring-list ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .bring-list li {
        padding: 6px 12px;
        border-radius: 999px;
        color: var(--muted);
        background: #f3eef8;
        font-size: 13px;
      }

      .location-button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 11px 20px;
        border: 1px solid var(--purple);
        border-radius: 6px;
        color: #fff;
        background: var(--purple);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      .location-button:hover {
        transform: translateY(-2px);
        border-color: var(--orchid);
        color: #fff;
        background: var(--orchid);
      }

      a:focus-visible {
        outline: 3px solid var(--orchid);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="invitation">
      <div class="invitation-art">
        <img
          src="huzzur.jpeg"
          alt="Birthday celebration"
        />
      </div>
      <div class="invitation-content">
        <p class="eyebrow">You're invited</p>
        <h1>Birthday Celebration</h1>
        <p class="date">
          <time datetime="2026-10-24">October 24</time>
        </p>
        <p class="message">
          Join me for a day of celebration, good company, and birthday cake.
        </p>

        <section class="bring-list" aria-labelledby="bring-title">
          <h2 id="bring-title">What to bring</h2>
          <ul>
            <li>Your blessings</li>
            <li>Love</li>
            <li>A gift, if you like</li>
          </ul>
        </section>

        <a
          class="location-button"
          href="https://maps.app.goo.gl/ZJvNZGnCMAGYySkZ8"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open location <span aria-hidden="true">↗</span>
        </a>
      </div>
    </main>
  </body>
</html>
